<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fenster — a browser that writes no browser code</title>
<meta name="description" content="A WebKit browser for Mac, iPhone and iPad. Address bar, back, forward, reload, tabs. Nothing else until there's a reason. This page is the demo.">
<meta name="theme-color" content="#1d1d1f">
<meta property="og:title" content="Fenster — a web browser">
<meta property="og:description" content="A text field and a WebKit view. Mac, iPhone, iPad.">
<meta property="og:type" content="website">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
@import url("https://heyitsmejosh.com/tokens.css");
:root{--ink:#1d1d1f;--paper:#f5f5f7;--bar:#fff;--field:#f5f5f7;--border:#d2d2d7;--dim:#6e6e73;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bar:#1e1e20;--field:#2c2c2e;--border:#3a3a3c;--dim:#98989d;}}
:root[data-theme="dark"]{--bar:#1e1e20;--field:#2c2c2e;--border:#3a3a3c;--dim:#98989d;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--bar);border-bottom:1px solid var(--border);flex:none}
.bar .brand{display:flex;align-items:center;gap:8px;font-weight:600;margin-right:6px;color:var(--text);text-decoration:none}
.bar .brand img{width:22px;height:22px;border-radius:6px}
.bar button{background:none;border:0;color:var(--dim);font:inherit;font-size:1.05rem;cursor:pointer;padding:4px 7px;border-radius:6px;line-height:1}
.bar button:hover{background:var(--field);color:var(--text)}
.bar button:disabled{opacity:.35;cursor:default;background:none}
.bar input{flex:1;min-width:0;background:var(--field);border:0;border-radius:8px;padding:7px 12px;color:var(--text);font:inherit;font-size:.95rem;outline:none}
.bar input:focus{box-shadow:0 0 0 2px var(--accent)}
.bar .src{color:var(--dim);font-size:.9rem;text-decoration:none;padding:4px 8px;border-radius:6px}
.bar .src:hover{background:var(--field);color:var(--text)}
iframe{flex:1;width:100%;border:0;background:#fff}
@media (max-width:560px){.bar .brand span,.bar .src{display:none}}
</style>
</head>
<body>
<form class="bar" id="bar" role="navigation" aria-label="Browser bar">
  <a class="brand" href="/" aria-label="Fenster home"><img src="icon.svg" alt=""><span>Fenster</span></a>
  <button type="button" id="back" aria-label="Back">‹</button>
  <button type="button" id="fwd" aria-label="Forward">›</button>
  <input id="addr" value="fenster.heyitsmejosh.com" aria-label="Search or enter address" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search or enter address">
  <button type="submit" id="go" aria-label="Reload">↻</button>
  <a class="src" href="https://github.com/nulljosh/fenster">Source</a>
</form>
<iframe id="page" src="start.html" title="Fenster" sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-top-navigation-by-user-activation"></iframe>
<script>
// Mirrors resolve() in FensterApp.swift; Wikipedia stands in for the search engine because DuckDuckGo refuses framing.
function resolve(s){s=s.trim();if(!s)return null;if(s.includes('://'))return s;if(!s.includes(' ')&&s.includes('.'))return 'https://'+s;return 'https://en.wikipedia.org/wiki/Special:Search?search='+encodeURIComponent(s)}
const f=document.getElementById('bar'),a=document.getElementById('addr'),p=document.getElementById('page');
const hist=['start.html'];let i=0;
function show(u){p.src=u;a.value=u==='start.html'?'fenster.heyitsmejosh.com':u.replace(/^https?:\/\//,'');document.getElementById('back').disabled=i===0;document.getElementById('fwd').disabled=i===hist.length-1}
f.addEventListener('submit',e=>{e.preventDefault();const u=resolve(a.value);if(!u)return;hist.splice(i+1);hist.push(u);i=hist.length-1;show(u);a.blur()});
document.getElementById('back').addEventListener('click',()=>{if(i>0){i--;show(hist[i])}});
document.getElementById('fwd').addEventListener('click',()=>{if(i<hist.length-1){i++;show(hist[i])}});
a.addEventListener('focus',()=>a.select());
show('start.html');
</script>
</body>
</html>
