name: Lucarne
options:
  bundleIdPrefix: com.nulljosh
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "202609140530"
targets:
  Lucarne:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.lucarne
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: QMM486NPYC
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Lucarne.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Lucarne-macOS.entitlements
  LucarneTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests
    dependencies:
      - target: Lucarne
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.lucarne.tests
        "TEST_HOST[sdk=macosx*]": $(BUILT_PRODUCTS_DIR)/Lucarne.app/Contents/MacOS/Lucarne
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: QMM486NPYC
schemes:
  Lucarne:
    build:
      targets:
        Lucarne: all
        LucarneTests: [test]
    test:
      targets:
        - LucarneTests
    run:
      config: Debug
    archive:
      config: Release
    shared: true
